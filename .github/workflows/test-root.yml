name: test root

on:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'go.mod'
      - '.github/workflows/test-root.yml'
  pull_request:
    paths:
      - '*.go'
      - 'go.mod'
      - '.github/workflows/test-root.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: cover-root
          path: cover.out
          if-no-files-found: ignore
      - if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./cover.out
          flags: root
          fail_ci_if_error: false
