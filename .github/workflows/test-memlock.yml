name: test memlock

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: memlock

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: memlock/cover.out
          flags: memlock
          fail_ci_if_error: false
